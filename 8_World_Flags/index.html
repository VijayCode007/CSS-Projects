<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flags around the World</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="flags">
            <div class="flag france">
                <div class="stripe" style="--color:blue"></div>
                <div class="stripe" style="--color:white"></div>
                <div class="stripe" style="--color:red"></div>
            </div>
            <div class="flag germany">
                <div class="stripe" style="--color:black"></div>
                <div class="stripe" style="--color:red"></div>
                <div class="stripe" style="--color:yellow"></div>
            </div>
            
            <div class="flag georgia">
                <div class="blocks">
                    <div class="cross"></div>
                    <div class="cross"></div>
                </div>
                <div class="blocks">
                    <div class="cross"></div>
                    <div class="cross"></div>
                </div>
                <div class="blocks">
                    <div class="cross"></div>
                    <div class="cross"></div>
                </div>
                <div class="blocks">
                    <div class="cross"></div>
                    <div class="cross"></div>
                </div>
            </div>

            <div class="flag japan">
                <div class="circle"></div>
            </div>
            <div class="flag madagascar">
                <div class="stripe left" style="--color:white"></div>
                <div class="stripe" style="--color:red"></div>
                <div class="stripe" style="--color:green"></div>
            </div>
            <div class="flag congo"></div>
        </div>

    </div>
</body>

</html>
